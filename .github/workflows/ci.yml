name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # typecheck + build + testes + bump controlado + .tgz + .sha256
      - run: npm run release -- --current
      - uses: actions/upload-artifact@v4
        with:
          name: auto-tracking-angular
          path: release/
